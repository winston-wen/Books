<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc">
 <title id="title">清初北京教堂位置示意图（重绘）</title>
 <desc id="desc">北京内城中，西堂在西直门内；北堂旧址在中海西侧蚕池口；东堂在王府井；南堂在宣武门内。北堂旧址与今日西什库教堂不同。本图只表示相对方位，不按比例。</desc>
 <rect width="1000" height="850" fill="#fffdf9"/>
 <g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#302b25">
  <text x="500" y="48" font-size="29" text-anchor="middle">清初北京教堂位置示意图</text>
  <text x="500" y="80" font-size="17" text-anchor="middle" fill="#786c5c">依据正文与北京市官方教堂沿革资料重绘 · 不按比例</text>
  <rect x="130" y="129" width="740" height="521" fill="#f6f2ea" stroke="#847764" stroke-width="4"/>
  <text x="750" y="165" font-size="20" fill="#786c5c">北京内城</text>
  <path d="M400,222 H690 V585 H400 Z" fill="#e9e1d2" stroke="#b2a58e" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="657" y="558" font-size="18" text-anchor="middle" fill="#88785e">皇城</text>
  <rect x="539" y="282" width="104" height="213" fill="#dcc9b4" stroke="#a58665" stroke-width="2"/>
  <text x="591" y="380" font-size="24" text-anchor="middle">紫禁城</text>
  <ellipse cx="485" cy="274" rx="29" ry="45" fill="#c9dfe0"/>
  <ellipse cx="493" cy="381" rx="32" ry="61" fill="#c9dfe0"/>
  <ellipse cx="490" cy="476" rx="36" ry="43" fill="#c9dfe0"/>
  <text x="493" y="384" font-size="16" text-anchor="middle" fill="#466a71">中海</text>
  <path d="M890,222 V160 M880,177 L890,159 L900,177" fill="none" stroke="#574e43" stroke-width="2"/>
  <text x="890" y="146" font-size="20" text-anchor="middle">北</text>
  <g fill="#955039"><path d="M225,194 l-11,20 h22 Z"/><path d="M413,374 l-11,20 h22 Z"/><path d="M754,334 l-11,20 h22 Z"/><path d="M348,590 l-11,20 h22 Z"/></g>
  <text x="249" y="209" font-size="23">④ 西堂</text><text x="249" y="237" font-size="17">西直门内 · 1723</text>
  <text x="394" y="378" font-size="23" text-anchor="end">③ 北堂旧址</text><text x="394" y="406" font-size="17" text-anchor="end">蚕池口 · 1703开堂</text>
  <text x="736" y="299" font-size="23" text-anchor="middle">② 东堂</text><text x="736" y="325" font-size="17" text-anchor="middle">王府井 · 1655</text>
  <text x="375" y="601" font-size="23">① 南堂</text><text x="375" y="629" font-size="17">宣武门内 · 1605 / 1650重建</text>
  <rect x="304" y="644" width="33" height="12" fill="#fffdf9"/><text x="320" y="682" font-size="19" text-anchor="middle">宣武门</text>
  <rect x="124" y="180" width="12" height="27" fill="#fffdf9"/><text x="106" y="201" font-size="18" text-anchor="end">西直门</text>
  <rect x="130" y="715" width="740" height="86" rx="6" fill="#eee8dd"/>
  <text x="156" y="750" font-size="18">北堂标的是康熙时的蚕池口旧址，1886年才迁建西什库。</text>
  <text x="156" y="780" font-size="18">西堂始建于雍正元年；编号与本章原图注对应。</text>
 </g>
</svg>
