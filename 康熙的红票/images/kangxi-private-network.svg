<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-labelledby="title desc">
  <title id="title">康熙私人关系网络运行示意图（依据正文重绘）</title>
  <desc id="desc">血缘、姻亲、主奴世袭关系或圈内人保荐带来信任；信任使人进入私人圈子并与康熙往来；往来产生特权，特权便于完成任务，完成任务又加强往来和信任。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#62584d" stroke-width="1.5"/></marker></defs>
  <rect width="1000" height="670" fill="#fffdf9"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif" text-anchor="middle" fill="#302b25">
    <text x="500" y="48" font-size="28">康熙私人关系网络运行示意图</text>
    <text x="500" y="80" font-size="16" fill="#746a5d">依据本章“小结”重绘 · 非原书图片</text>
    <rect x="180" y="109" width="640" height="74" rx="8" fill="#f0ece4"/>
    <text x="500" y="140" font-size="20">血缘、姻亲、主奴世袭关系</text>
    <text x="500" y="168" font-size="19">或由圈内人保荐</text>
    <path d="M500,184 V223" stroke="#62584d" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="398" y="233" width="204" height="84" rx="12" fill="#efe0ce" stroke="#8b6744" stroke-width="2"/>
    <text x="500" y="270" font-size="28">信任</text><text x="500" y="298" font-size="17">私人关系的核心</text>
    <rect x="105" y="442" width="220" height="104" rx="12" fill="#ede9df" stroke="#8d8472"/>
    <text x="215" y="483" font-size="28">往来</text><text x="215" y="517" font-size="17">进入圈子，关系渐近</text>
    <rect x="675" y="442" width="220" height="104" rx="12" fill="#e6ece8" stroke="#6e8476"/>
    <text x="785" y="483" font-size="28">特权</text><text x="785" y="517" font-size="17">私下觐见、通信、地方优待</text>
    <path d="M409,320 Q284,337 236,426" fill="none" stroke="#62584d" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="281" y="344" font-size="18">获准进入</text>
    <path d="M341,494 H659" stroke="#62584d" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="500" y="475" font-size="18">关系变近，获得优待</text>
    <path d="M781,426 Q724,322 614,287" fill="none" stroke="#62584d" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="850" y="334" font-size="18">便于完成任务</text>
    <text x="850" y="362" font-size="18">增进往来与信任</text>
    <text x="500" y="613" font-size="18" fill="#746a5d">信任未被重大事件破坏，关系便可持续</text>
  </g>
</svg>
